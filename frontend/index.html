<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/logos/favicon-512.png" sizes="512x512" />
    <link rel="icon" type="image/png" href="/logos/favicon-256.png" sizes="256x256" />
    <link rel="icon" type="image/png" href="/logos/favicon-180.png" sizes="180x180" />
    <link rel="icon" type="image/png" href="/logos/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/logos/favicon-16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/logos/favicon-256.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logos/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d1b" />
    <meta name="description" content="ReplyDesk — atendimento via WhatsApp automatizado com bots inteligentes, multiempresas e IA integrada." />
    <meta property="og:description" content="ReplyDesk — atendimento via WhatsApp automatizado com bots inteligentes, multiempresas e IA integrada." />
    <meta property="og:image" content="/logos/logo.png" />
    <meta property="og:title" content="ReplyDesk — Atendimento automatizado no WhatsApp" />
    <meta property="og:type" content="website" />
    <title>ReplyDesk — Atendimento automatizado no WhatsApp</title>
    <script>
      // Evita flash de tema errado: aplica a classe antes do React montar.
      (function () {
        try {
          var theme = localStorage.getItem("replydesk-theme");
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = theme && theme !== "system" ? theme : systemDark ? "dark" : "light";
          if (resolved === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
