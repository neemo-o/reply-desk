server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — todas as rotas servem o index.html do React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estáticos (Vite gera com hash no nome)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy da API para o backend (mesma rede docker)
    # Usamos resolver + variável no proxy_pass para que o nginx RE-RESOLVA
    # o hostname "api" no DNS interno do Docker a cada 10s. Sem isso, o nginx
    # cacheia o IP do upstream na inicialização e devolve 502 Bad Gateway
    # sempre que o container da API reinicia e pega um IP novo.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api http://api:3000;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

   
    location /realtime/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api http://api:3000;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # WS longas-lived — não cortar por timeout.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}
