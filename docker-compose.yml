# ═════════════════════════════════════════════════════════════════════
# 🚀 docker-compose.yml — Stack COMPLETA do ReplyDesk (raiz)
#
# Um único comando sobe TUDO:
#   docker compose up -d --build
#
# O que acontece (automático, em ordem):
#   1. Sobe Postgres + Redis + MinIO (com healthchecks)
#   2. Faz build do backend (Dockerfile multi-stage: deps + prisma generate + nest build)
#   3. Faz build do frontend (Dockerfile multi-stage: Vite build → Nginx serve SPA)
#   4. O entrypoint do backend aplica `prisma migrate deploy` e `prisma generate`
#   5. Sobe a API (porta 3000) e o Worker (BullMQ consumer)
#   6. Sobe o Frontend no Nginx (porta 80/8080) com proxy reverso /api → backend
#
# Cada serviço lê seu próprio .env individual:
#   backend/.env  → injetado no api e worker via env_file
#   frontend/.env → usado no build do frontend (VITE_ vars via --build-arg via .env)
#
# Logs:
#   docker compose logs -f api worker frontend
#   docker compose logs -f
#
# Status:
#   docker compose ps
#
# Derrubar:
#   docker compose down
# ═════════════════════════════════════════════════════════════════════

services:
  # ─── INFRA ───────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_saas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── EVOLUTION API (WhatsApp externo) ──────────────────────────────
  #
  # 🔌 A Evolution API é o serviço EXTERNO responsável pela conexão e
  # persistência das sessões do WhatsApp. As credenciais de autenticação
  # ficam no volume /evolution_data — reinicializações do Docker NÃO
  # destroem as sessões conectadas.
  #
  # O backend se comunica via EVOLUTION_API_URL=http://evolution-api:8080
  # e configura webhooks para que todos os eventos (conexão, mensagens,
  # status) cheguem ao endpoint público /api/v1/webhooks/evolution.
  #
  # Porta 8081 externa evita colisão com o frontend (8080) e com a porta
  # interna da Evolution (8080, exposta só para debug).
  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    environment:
          # Auth global — todas as chamadas externas ao backend (api) precisam
          # deste token, enviado via header `apikey`. Backend lê via
          # EVOLUTION_API_KEY.
          AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-replydesk-evolution-token-change-me}
          # Expor instâncias na listagem (fetchInstances) — útil para debug.
          AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
          SERVER_NAME: evolution
          SERVER_TYPE: http
          SERVER_PORT: 8080
          SERVER_URL: http://0.0.0.0:8080
          # 🛢️ Persistence: a Evolution usa Postgres (schema evolution_api).
          # Usamos o mesmo Postgres do backend (host `postgres`, porta 5432).
          DATABASE_PROVIDER: postgresql
          DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-whatsapp_saas}?schema=evolution_api
          DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
          # 🔒 Persistência MÍNIMA na Evolution: apenas o que o ReplyDesk usa.
          # Por padrão a Evolution tenta salvar TODA a agenda de contatos,
          # chats, histórico de mensagens, edições, labels, status "online"
          # dos últimos 7 dias — informação privada do usuário que não nos
          # serve para nada. Mantemos só:
          #   - INSTANCE   → metadata da instância (obrigatório p/ gestão)
          #   - NEW_MESSAGE → mensagem nova (a Evolution expõe a referência;
          #                   quem persiste de fato é o nosso webhook, e
          #                   manter isso ajuda em debug pós-restart)
          # Tudo abaixo é desligado:
          DATABASE_SAVE_DATA_INSTANCE: "true"
          DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
          DATABASE_SAVE_MESSAGE_UPDATE: "false"
          DATABASE_SAVE_DATA_CONTACTS: "false"
          DATABASE_SAVE_DATA_CHATS: "false"
          DATABASE_SAVE_DATA_LABELS: "false"
          DATABASE_SAVE_DATA_HISTORIC: "false"
          DATABASE_SAVE_IS_ON_WHATSAPP: "false"
          # 🔴 Redis — Evolution usa CACHE_REDIS_URI para cache
          CACHE_REDIS_ENABLED: "true"
          CACHE_REDIS_URI: redis://redis:6379/6
          CACHE_REDIS_PREFIX_KEY: "evolution"
          CACHE_REDIS_TTL: "604800"
          CACHE_REDIS_SAVE_INSTANCES: "false"
          # CORS para permitir chamadas do backend
          CORS_ORIGIN: "*"
          CORS_METHODS: "GET,POST,PUT,DELETE"
          CORS_CREDENTIALS: "true"
          # Logs
          LOG_LEVEL: "ERROR,WARN,INFO,LOG,WEBHOOKS,WEBSOCKET"
          LOG_COLOR: "true"
          LOG_BAILEYS: "error"
          # Session client name
          CONFIG_SESSION_PHONE_CLIENT: "ReplyDesk"
          CONFIG_SESSION_PHONE_NAME: "ReplyDesk"
          # Del instance behavior
          DEL_INSTANCE: "false"
          # Metrics
          PROMETHEUS_METRICS: "false"
          METRICS_AUTH_REQUIRED: "true"
    volumes:
      # 🛢️ A Evolution usa Postgres (schema evolution_api) — não precisa
      # de volume dedicado para dados de sessão (que ficam no Postgres).
      # Mantemos o volume caso a Evolution escreva arquivos de mídia/local
      # em /evolution_data/instances/* (cache de mídia).
      - evolution_data:/evolution_data
    ports:
      # 🔒 Em produção: pode-se omitir este mapping e deixar o serviço
      # acessível apenas dentro da rede Docker (mais seguro). Aqui
      # expondo 127.0.0.1:8081:8080 para inspeção/debug local.
      - "127.0.0.1:${EVOLUTION_PORT:-8081}:8080"
    healthcheck:
      # Ping no endpoint /instance/fetchInstances com apikey esperado 401,
      # mas indica que o servidor HTTP subiu. O test precisa aceitar qq código.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/manager/findInstances | grep -qE '^[1-5]'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── BACKEND (API + Worker) ────────────────────────────

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # 🔒 Garante NODE_ENV=development no compose de dev — o Dockerfile fixa
      # ENV NODE_ENV=production, e sem este override o container roda em produção
      # (fail-closed de env.validation pode rejeitar config de dev e causar 401).
      NODE_ENV: development
      # Sobrescreve DATABASE_URL para usar o hostname `postgres` interno do Docker
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-whatsapp_saas}?schema=public
      # Redis e MinIO usam hostnames internos do Docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      # 🔌 Evolution API — URL interna do Docker (backend → evolution-api)
      EVOLUTION_API_URL: http://evolution-api:8080
      # 🔌 URL que a Evolution usará para chamar o backend de volta.
      # Dentro do Docker, a Evolution alcança o backend pelo hostname `api`.
      EVOLUTION_WEBHOOK_BASE_URL: http://api:3000
      # 🤖 Resposta automática placeholder (temporário) ao receber WhatsApp.
      # Vazio = responde a qualquer número. Preencha com seu próprio número
      # (só dígitos) para responder só a você.
      EVO_PLACEHOLDER_OWNER_PHONE: ${EVO_PLACEHOLDER_OWNER_PHONE:-}
      EVO_PLACEHOLDER_TEXT: ${EVO_PLACEHOLDER_TEXT:-Olá! Recebi sua mensagem. Em breve um atendente responderá. 🤖 ReplyDesk}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      evolution-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "dist/src/worker.js"]
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-whatsapp_saas}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      # 🔌 Worker também precisa falar com a Evolution (jobs de connect-session)
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_WEBHOOK_BASE_URL: http://api:3000
      # 🤖 Placeholder — Worker também precisa porque o WebhooksModule é
      # registrado no API (não no worker), mas mantemos a env simétrica.
      EVO_PLACEHOLDER_OWNER_PHONE: ${EVO_PLACEHOLDER_OWNER_PHONE:-}
      EVO_PLACEHOLDER_TEXT: ${EVO_PLACEHOLDER_TEXT:-Olá! Recebi sua mensagem. Em breve um atendente responderá. 🤖 ReplyDesk}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── FRONTEND (Vite SPA → Nginx) ────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # VITE_API_URL é injetado no build do Vite.
        # Em prod via Docker, o Nginx faz proxy /api → api:3000,
        # então o frontend pode chamar /api/v1 (URL relativa) e funciona em ambos.
        # Em dev local (npm run dev) usa a URL completa do .env.
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  evolution_data:
