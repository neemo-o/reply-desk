# ═════════════════════════════════════════════════════════════════════
# 🚀 docker-compose.yml — Stack COMPLETA do ReplyDesk (raiz)
#
# Um único comando sobe TUDO:
#   docker compose up -d --build
#
# O que acontece (automático, em ordem):
#   1. Sobe Postgres + Redis + MinIO (com healthchecks)
#   2. Faz build do backend (Dockerfile multi-stage: deps + prisma generate + nest build)
#   3. Faz build do frontend (Dockerfile multi-stage: Vite build → Nginx serve SPA)
#   4. O entrypoint do backend aplica `prisma migrate deploy` e `prisma generate`
#   5. Sobe a API (porta 3000) e o Worker (BullMQ consumer)
#   6. Sobe o Frontend no Nginx (porta 80/8080) com proxy reverso /api → backend
#
# Cada serviço lê seu próprio .env individual:
#   backend/.env  → injetado no api e worker via env_file
#   frontend/.env → usado no build do frontend (VITE_ vars via --build-arg via .env)
#
# Logs:
#   docker compose logs -f api worker frontend
#   docker compose logs -f
#
# Status:
#   docker compose ps
#
# Derrubar:
#   docker compose down
# ═════════════════════════════════════════════════════════════════════

services:
  # ─── INFRA ───────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_saas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── BACKEND (API + Worker) ────────────────────────────

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # 🔒 Garante NODE_ENV=development no compose de dev — o Dockerfile fixa
      # ENV NODE_ENV=production, e sem este override o container roda em produção
      # (fail-closed de env.validation pode rejeitar config de dev e causar 401).
      NODE_ENV: development
      # Sobrescreve DATABASE_URL para usar o hostname `postgres` interno do Docker
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-whatsapp_saas}?schema=public
      # Redis e MinIO usam hostnames internos do Docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "dist/src/worker.js"]
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-whatsapp_saas}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── FRONTEND (Vite SPA → Nginx) ────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # VITE_API_URL é injetado no build do Vite.
        # Em prod via Docker, o Nginx faz proxy /api → api:3000,
        # então o frontend pode chamar /api/v1 (URL relativa) e funciona em ambos.
        # Em dev local (npm run dev) usa a URL completa do .env.
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  minio_data:
